name: Promote Release to Main

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    name: promote
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate merged PR is a release PR
        id: gate
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const names = new Set(files.map((f) => f.filename));
            const hasPubspec = names.has("pubspec.yaml");
            const hasChangelog = names.has("CHANGELOG.md");
            const title = (pr.title || "").toLowerCase();
            const isReleaseStyleTitle = title.includes("release");
            const isBotAuthor = pr.user?.login === "github-actions[bot]";
            const isReleasePr = (isReleaseStyleTitle || isBotAuthor) && hasPubspec && hasChangelog;
            core.setOutput("is_release_pr", String(isReleasePr));

      - name: Create or update promotion PR (develop -> main)
        if: steps.gate.outputs.is_release_pr == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headRef = `${owner}:develop`;
            const base = "main";

            const open = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: headRef,
              base,
              per_page: 10,
            });

            let pr = open.data[0];
            if (!pr) {
              pr = (await github.rest.pulls.create({
                owner,
                repo,
                head: "develop",
                base: "main",
                title: "chore: promote develop release to main",
                body: [
                  "Automated release promotion PR.",
                  "",
                  "- Source branch: `develop`",
                  "- Target branch: `main`",
                  "- Trigger: merged release PR on `develop`",
                ].join("\\n"),
                maintainer_can_modify: true,
              })).data;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.number,
              labels: ["release-promote"],
            });
